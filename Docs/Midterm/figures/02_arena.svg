<text x="520.0" y="735.0" font-size="20" text-anchor="middle" fill="#3a9d5d">왼쪽 한 유닛의 시야: 90°, 레이 16개</text>
<text x="1000" y="190" font-size="25" font-weight="700" fill="#1d2633">한 라운드</text>
<text x="1000" y="226" font-size="22" fill="#5f6b78">한 팀 전멸 또는 45초</text>
<text x="1000" y="294" font-size="25" font-weight="700" fill="#1d2633">시간 초과</text>
<text x="1000" y="330" font-size="22" fill="#5f6b78">양쪽 모두 패배 (TFT 와 같은 규칙)</text>
<text x="1000" y="398" font-size="25" font-weight="700" fill="#1d2633">축소 구역</text>
<text x="1000" y="434" font-size="22" fill="#5f6b78">20초부터 15초 동안 1,750 → 600 cm,</text>
<text x="1000" y="466" font-size="22" fill="#5f6b78">밖에 있으면 초당 10 피해</text>
<text x="1000" y="534" font-size="25" font-weight="700" fill="#1d2633">스폰</text>
<text x="1000" y="570" font-size="22" fill="#5f6b78">팀당 10명이 호 모양으로, 중심을 보고 시작</text>
<text x="1000" y="602" font-size="22" fill="#5f6b78">위치 ±3° / ±100 cm 흔들림</text>
<text x="1000" y="670" font-size="25" font-weight="700" fill="#1d2633">진영 교대</text>
<text x="1000" y="706" font-size="22" fill="#5f6b78">학습 중 라운드마다 두 팀 위치를 맞바꿈</text>
<text x="1000" y="774" font-size="25" font-weight="700" fill="#1d2633">규모</text>
<text x="1000" y="810" font-size="22" fill="#5f6b78">이런 아레나 16개를 동시에 실행</text>
<text x="1000" y="860" font-size="18" fill="#5f6b78">엄폐물은 7개이며 그림에는 중앙 1개만 표시했다.</text>
